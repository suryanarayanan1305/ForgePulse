# Mosquitto MQTT Broker Configuration
# =====================================
# This is a LOCAL DEVELOPMENT configuration.
# Production: Use a managed broker (HiveMQ Cloud, EMQX) via environment variables.
#
# WHY NO AUTHENTICATION IN LOCAL CONFIG?
#   Local development simplicity. In production, enable:
#   - password_file /mosquitto/config/passwd
#   - require_certificate true (TLS mutual auth)

# Allow anonymous connections (local dev only — NEVER in production)
allow_anonymous true

# Listen on standard MQTT TCP port
listener 1883 0.0.0.0

# Listen on WebSocket port (useful for browser-based MQTT debugging tools)
listener 9001 0.0.0.0
protocol websockets

# Persistence: Save retained messages and subscription info to disk
# This means retained messages survive broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Maximum allowed packet size (default: 256MB — appropriate for telemetry)
# Individual telemetry messages are ~500 bytes, well within this limit
message_size_limit 0

# Maximum inflight messages per QoS 1/2 client
max_inflight_messages 100
